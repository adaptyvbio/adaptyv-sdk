[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptyv-sdk"
version = "0.1.0"
description = "Python SDK for Adaptyv Foundry API - design protein binders with BindCraft/Germinal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Adaptyv Bio", email = "engineering@adaptyvbio.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
modal = ["modal>=0.64.0"]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "datamodel-code-generator>=0.25.0",
]
all = [
    "adaptyv-sdk[modal,server]",
]

[project.urls]
Homepage = "https://github.com/adaptyvbio/adaptyv-sdk"
Documentation = "https://docs.adaptyvbio.com/sdk"
Repository = "https://github.com/adaptyvbio/adaptyv-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptyv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["adaptyv"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "adaptyv.types.generated"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end tests requiring network access",
]
