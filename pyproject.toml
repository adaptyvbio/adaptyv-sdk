[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptyv-sdk"
version = "0.1.0"
description = "Python SDK for Adaptyv Foundry API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Adaptyv Bio", email = "tudor@adaptyvbio.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/adaptyvbio/adaptyv-sdk"
Documentation = "https://docs.adaptyvbio.com/sdk"
Repository = "https://github.com/adaptyvbio/adaptyv-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptyv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["adaptyv"]

[tool.ruff.lint.per-file-ignores]
# Integration tests call load_dotenv() before importing the SDK so that
# credentials are present when module-level fixtures build a client.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "adaptyv.types.generated"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring network access",
    "costly: marks tests that incur real costs (create + confirm experiments)",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.59.1",
]
