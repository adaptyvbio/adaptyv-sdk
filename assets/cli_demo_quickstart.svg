<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <style>

    .terminal {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0A1014;
      color: #F8FAFC;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
    }

    .terminal-header {
      background: #1C2432;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terminal-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot-red { background: #EF4444; }
    .dot-yellow { background: #F59E0B; }
    .dot-green { background: #10B981; }

    .terminal-title {
      flex: 1;
      text-align: center;
      color: #94A3B8;
      font-size: 12px;
      margin-right: 52px;
    }

    .terminal-body {
      padding: 24px;
      font-size: 12px;
      line-height: 17px;
    }

    .line {
      white-space: pre;
    }

    .prompt-symbol { color: #36B7F6; }
    .prompt-text { color: #F8FAFC; }
    .output { color: #94A3B8; }
    .success { color: #10B981; }
    .brand { color: #36B7F6; }
    .muted { color: #64748B; }
    .primary { color: #F8FAFC; }
    .function { color: #82AAFF; }
    .string { color: #C3E88D; }
    .keyword { color: #F8FAFC; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .cursor {
      animation: blink 1s step-end infinite;
    }

  </style>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="terminal">
      <div class="terminal-header">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow"></div>
        <div class="terminal-dot dot-green"></div>
        <div class="terminal-title">python</div>
      </div>
      <div class="terminal-body">
        <div class="line"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="keyword">from</span> <span class="primary">adaptyv</span> <span class="keyword">import</span> <span class="primary">Lab</span></div>
        <div class="line output"> </div>
        <div class="line"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="primary">lab</span> = <span class="primary">Lab</span>.<span class="function">setup</span>()</div>
        <div class="line output"> </div>
        <div class="line"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="primary">result</span> = <span class="primary">lab</span>.<span class="function">create_experiment</span>(</div>
        <div class="line"><span class="prompt-symbol">... </span>    <span class="primary">name</span>=<span class="string">"PD-L1 Binders"</span>,</div>
        <div class="line"><span class="prompt-symbol">... </span>    <span class="primary">sequences</span>={</div>
        <div class="line"><span class="prompt-symbol">... </span>        <span class="string">"clone_1"</span>: <span class="string">"MVKVGVNG..."</span>,</div>
        <div class="line"><span class="prompt-symbol">... </span>        <span class="string">"clone_2"</span>: <span class="string">"MKVLVAG..."</span>,</div>
        <div class="line"><span class="prompt-symbol">... </span>    },</div>
        <div class="line"><span class="prompt-symbol">... </span>    <span class="primary">target_id</span>=<span class="string">"abc123-..."</span>,</div>
        <div class="line"><span class="prompt-symbol">... </span>)</div>
        <div class="line brand">Submitting 2 sequences to Adaptyv Foundry...</div>
        <div class="line success">&#x2713; Experiment created: exp_abc123</div>
        <div class="line output"> </div>
        <div class="line"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="function">print</span>(<span class="primary">result</span>.<span class="primary">experiment_url</span>)</div>
        <div class="line output"><span class="brand">https://foundry.adaptyv.bio/experiments/exp_abc123</span></div>
        <div class="line output"> </div>
        <div class="line output"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="cursor">_</span></div>
      </div>
    </div>
  </foreignObject>
</svg>
