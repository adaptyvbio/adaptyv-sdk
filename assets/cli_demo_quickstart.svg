<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <style>

    .terminal {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0A1014;
      color: #F8FAFC;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
    }

    .terminal-header {
      background: #1C2432;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terminal-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot-red { background: #EF4444; }
    .dot-yellow { background: #F59E0B; }
    .dot-green { background: #10B981; }

    .terminal-title {
      flex: 1;
      text-align: center;
      color: #94A3B8;
      font-size: 12px;
      margin-right: 52px;
    }

    .terminal-body {
      padding: 24px;
      font-size: 12px;
      line-height: 17px;
    }

    .line {
      white-space: pre;
      opacity: 0;
    }

    .prompt-symbol { color: #36B7F6; }
    .prompt-text { color: #F8FAFC; }
    .output { color: #94A3B8; }
    .success { color: #10B981; }
    .brand { color: #36B7F6; }
    .muted { color: #64748B; }
    .primary { color: #F8FAFC; }
    .function { color: #82AAFF; }
    .string { color: #C3E88D; }
    .keyword { color: #F8FAFC; }

    /* 10s cycle: gradual fades with ease-in-out */
    @keyframes appear-0 {
      0% { opacity: 0; } 4% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-5 {
      0%, 5% { opacity: 0; } 9% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-10 {
      0%, 10% { opacity: 0; } 14% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-15 {
      0%, 15% { opacity: 0; } 19% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-20 {
      0%, 20% { opacity: 0; } 24% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-25 {
      0%, 25% { opacity: 0; } 29% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-30 {
      0%, 30% { opacity: 0; } 34% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-35 {
      0%, 35% { opacity: 0; } 39% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-40 {
      0%, 40% { opacity: 0; } 44% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-45 {
      0%, 45% { opacity: 0; } 49% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-50 {
      0%, 50% { opacity: 0; } 54% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-55 {
      0%, 55% { opacity: 0; } 59% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }
    @keyframes appear-60 {
      0%, 60% { opacity: 0; } 64% { opacity: 1; } 68% { opacity: 1; } 76% { opacity: 0; } 100% { opacity: 0; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .cursor {
      animation: blink 1s step-end infinite;
    }

  </style>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="terminal">
      <div class="terminal-header">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow"></div>
        <div class="terminal-dot dot-green"></div>
        <div class="terminal-title">python</div>
      </div>
      <div class="terminal-body">
        <div class="line" style="animation: appear-0 10s infinite;"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="keyword">from</span> <span class="primary">adaptyv</span> <span class="keyword">import</span> <span class="primary">Lab</span></div>
        <div class="line output" style="animation: appear-5 10s infinite;"> </div>
        <div class="line" style="animation: appear-5 10s infinite;"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="primary">lab</span> = <span class="primary">Lab</span>.<span class="function">setup</span>()</div>
        <div class="line output" style="animation: appear-10 10s infinite;"> </div>
        <div class="line" style="animation: appear-10 10s infinite;"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="primary">result</span> = <span class="primary">lab</span>.<span class="function">create_experiment</span>(</div>
        <div class="line" style="animation: appear-15 10s infinite;"><span class="prompt-symbol">... </span>    <span class="primary">name</span>=<span class="string">"PD-L1 Binders"</span>,</div>
        <div class="line" style="animation: appear-20 10s infinite;"><span class="prompt-symbol">... </span>    <span class="primary">sequences</span>=[<span class="string">"MVKVGVNG..."</span>, <span class="string">"MKVLVAG..."</span>],</div>
        <div class="line" style="animation: appear-25 10s infinite;"><span class="prompt-symbol">... </span>    <span class="primary">target_id</span>=<span class="string">"abc123-..."</span>,</div>
        <div class="line" style="animation: appear-30 10s infinite;"><span class="prompt-symbol">... </span>)</div>
        <div class="line brand" style="animation: appear-35 10s infinite;">Submitting 2 sequences to Adaptyv Foundry...</div>
        <div class="line success" style="animation: appear-40 10s infinite;">&#x2713; Experiment created: exp_abc123</div>
        <div class="line output" style="animation: appear-45 10s infinite;"> </div>
        <div class="line" style="animation: appear-50 10s infinite;"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="function">print</span>(<span class="primary">result</span>.<span class="primary">experiment_url</span>)</div>
        <div class="line output" style="animation: appear-55 10s infinite;"><span class="brand">https://foundry.adaptyv.bio/experiments/exp_abc123</span></div>
        <div class="line output" style="animation: appear-60 10s infinite;"> </div>
        <div class="line output" style="animation: appear-60 10s infinite;"><span class="prompt-symbol">&gt;&gt;&gt; </span><span class="cursor">_</span></div>
      </div>
    </div>
  </foreignObject>
</svg>
